# Advisory: dependency ranges are caret (^X.Y.Z), not tilde or exact.
#
# NOT a required status check, on purpose. A red result means a range outside devDependencies and
# overrides is pinned with ~ or an exact version. Fix it, or, when the pin really has to stay, merge
# anyway and add the package to .github/caret-pins-allow.json with the reason so the next PR is green.
# The rules and accepted forms are in .github/scripts/check-caret-pins.mjs.
#
# The same file is copied byte-for-byte into every bizapps repo.
name: Caret pins

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [next, main, 'lts/**']
    # Safe to filter because nothing requires this check: a filtered-out workflow creates no
    # check run, which would only matter for a required context.
    paths:
      - '**/package.json'
      - '.github/caret-pins-allow.json'
      - '.github/scripts/check-caret-pins.mjs'
      - '.github/workflows/caret-pins.yml'
  workflow_dispatch:

concurrency:
  group: caret-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  caret-pins:
    name: 'caret pins (advisory)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check self-test
        run: node .github/scripts/check-caret-pins.mjs --self-test
      - name: Dependency ranges are caret
        run: node .github/scripts/check-caret-pins.mjs
