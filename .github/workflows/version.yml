# Maintains the "Version Packages" PR into `next`.
#
# This workflow NEVER publishes. Its only job is to turn the changesets sitting on `next`
# into a reviewable pull request containing the version bumps, the generated CHANGELOGs,
# the mj-app.json version sync, and a refreshed lockfile. Merging that PR is what makes
# `next` genuinely hold the new version.
#
# Why it exists: the release used to compute the version at publish time and push the
# result straight to `main` (and then to `next`). Both branches are covered by the
# `main-next-protect` ruleset, which requires a pull request, and `github-actions[bot]`
# cannot be granted a bypass — GitHub blocks that by design. Accounting's 0.2.0 published
# to npm and then failed with `GH013`, leaving the registry at 0.2.0 and the repo at
# 0.1.1 with no tag. Routing the bump through a PR removes the need to write to a
# protected branch at all, which is also the pattern `changesets/action` is built for.
name: Version Packages

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read # writes go through the App token, not GITHUB_TOKEN

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Mint a short-lived installation token. The reason this matters is that App-created PRs
      # DO trigger other workflows, whereas a PR opened with the default GITHUB_TOKEN creates
      # runs in `action_required` that sit until a maintainer clicks "Approve and run" — on
      # every push.
      #
      # It does NOT mean build.yml runs here: that workflow deliberately skips
      # `changeset-release/next`, so the lockfile this PR exists to refresh is first verified
      # against --frozen-lockfile on the release PR into `main`. An earlier version of this
      # comment claimed otherwise.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true # changeset version reads tags when generating CHANGELOG links

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        id: changesets
        with:
          # Pinned to v1 because this repo runs Changesets CLI v2 (`@changesets/cli ^2.29.8`).
          # The action version-gates on the CLI major and v2.x refuses outright:
          #   "This version of the Changesets action is designed to work with Changesets CLI
          #    v3. Changesets CLI v2 is not supported; use Changesets action v1 instead."
          # Moving to action v2 therefore means upgrading the CLI to v3 first — a separate
          # change with its own changeset-format and config implications, not a pin bump.
          #
          # Input names are major-specific, and Actions IGNORES unknown inputs rather than
          # failing, so a mismatch silently runs the action's defaults. v1 takes
          # `version`/`publish`/`title`/`commit`; v2 takes `version-script`/`publish-script`/
          # `pr-title`/`commit-message`. Passing v2 names to v1 is what produced a Version
          # Packages PR with no lockfile refresh and no mj-app.json sync — the tell was the
          # PR title falling back to the default "Version Packages".
          #
          # No `publish` input: this workflow only ever versions.
          version: pnpm run version:prepare
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
          github-token: ${{ steps.app-token.outputs.token }}

      # The action hard-codes the closing sentence of the PR body, and with no `publish` input it
      # picks the wrong half of its own ternary for us:
      #
      #   "you can merge this and publish to npm yourself or [setup this action to publish
      #    automatically]"
      #
      # Here publishing is neither manual nor this action's job — it happens when the release PR
      # into `main` merges. v1 has no input to override the body, so it is corrected in place.
      # The action rewrites the body on every update, so this re-applies each run.
      - name: Say how THIS repo publishes, in the PR body
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > /tmp/pr-body.md
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("/tmp/pr-body.md"); body = p.read_text()
          wrong = ("publish to npm yourself or [setup this action to publish automatically]"
                   "(https://github.com/changesets/action#with-publishing)")
          right = ("the versions below land on `next`. Publishing is a separate, deliberate step: "
                   "open a release PR from `next` into `main`, and merging THAT publishes to npm "
                   "and tags the release. Nothing here is manual, and nothing publishes from `next`")
          if wrong in body:
              p.write_text(body.replace(wrong, right))
              print("corrected the publish sentence")
          else:
              print("sentence not found — upstream wording may have changed; leaving the body alone")
          PYEOF
          gh pr edit "$PR_NUMBER" --body-file /tmp/pr-body.md
